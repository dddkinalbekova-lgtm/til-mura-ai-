<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIL MURA AI — Сөз өнері</title><style>:root{--gold:#d8ad62;--bg:#0a1727;--panel:#1b3044}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243c55,#081320 75%);color:#f9e9c8;font-family:Georgia,'Times New Roman',serif}header{text-align:center;padding:24px 12px;border-bottom:1px solid var(--gold)}h1{color:#f5cb7d;font-size:clamp(30px,7vw,52px);margin:4px}h2{color:#f7cf88}button,select,textarea,input{font:inherit}button{cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:18px}.nav,.tiles,.poets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.tile,.nav button,.poet,.action{border:1px solid var(--gold);border-radius:17px;background:#304458;color:#fff0d4;padding:22px 10px;text-align:center;min-height:95px}.tile{font-size:21px;font-weight:bold}.tile span{display:block;font-size:29px;margin-bottom:10px}.nav button{min-height:65px;padding:8px;font-size:14px}.panel{border:1px solid #b28d56;border-radius:23px;padding:22px;margin:22px 0;background:linear-gradient(145deg,#253a50,#101f31);box-shadow:0 8px 24px #0005}.hidden{display:none}.note{background:#f5e8cb;color:#263144;padding:16px;border-radius:13px;margin:12px 0;line-height:1.65}.note h3{margin:0 0 8px;color:#775122}.poet{font-size:20px}.poet small{display:block;font-size:14px;margin-top:8px}.action{min-height:40px;padding:12px;margin:6px 5px 6px 0;font-size:16px}textarea,input,select{width:100%;border:1px solid var(--gold);border-radius:10px;padding:13px;background:#fdf6e8;color:#17283a;margin:8px 0}textarea{min-height:180px}p,li{line-height:1.65}.stat{color:#ffdf9b;font-weight:bold}.portrait{background:linear-gradient(110deg,#061b32,#31506b);border:2px solid #cfa75e;border-radius:18px;padding:30px 16px;text-align:center;font-size:30px}.quote{font-style:italic;font-size:22px;color:#ffe nt-size:18px}@media(max-width:550px){.portal{padding:13px}.author-grid{grid-template-columns:1fr}.author-grid button{min-height:80px;flex-direction:row;justify-content:space-around}.author-grid strong{max-width:52%}.cabinet{padding:16px 5px}}</style><style>

const content=document.getElementById('content');const poets=[['Абай Құнанбайұлы','Ғылым таппай мақтанба,\nОрын таппай баптанба.\nҚұмарланып шаттанба,\nОйнап босқа күлуге.','Ғылым таппай мақтанба'],['Мұқағали Мақатаев','Үш бақытым','Үш бақытым'],['Сұлтанмахмұт Торайғыров','Шәкірт ойы','Шәкірт ойы']];let saved=JSON.parse(localStorage.getItem('tilmura_progress')||'{}'),recorded=[],recorder,stream;
function studentCabinet(){window.openLogin("student")}function teacherCabinet(){window.openLogin("teacher")}function show(id){document.getElementById('home').classList.add('hidden');content.classList.remove('hidden');let html='';if(id==='essay')html=essay();if(id==='poem')html=poem();if(id==='memorize'||id==='reading')html=poetList(id);if(id==='dictionary')html=dictionary();if(id==='test')html=test();if(id==='results')html=results();content.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});if(id==='essay'||id==='poem'){let t=document.querySelector('#studentText');t.value=localStorage.getItem('tilmura_'+id)||'';countWords(id)}}function home(){content.classList.add('hidden');document.getElementById('home').classList.remove('hidden');window.scrollTo(0,0)}function updateGrade(){if(!content.classList.contains('hidden'))home()}function range(){let g=+document.getElementById('grade').value;return g===5?'60–80':g<=7?'80–120':g<=9?'120–180':g===10?'180–230':'250–300'}function essay(){return `<h2>✍️ Эссе жазу ережелері</h2><div class="note"><h3>1. Кіріспе — шамамен 20–30%</h3>Тақырыптың өзектілігін ашып, негізгі тезисті және жеке көзқарасыңды білдір.</div><div class="note"><h3>2. Негізгі бөлім — шамамен 60%</h3>Ойыңды дәлелде. Аргументтер, нақты мысалдар, өмірлік деректер немесе көркем шығармадан дәйектер келтір.</div><div class="note"><h3>3. Қорытынды — шамамен 10%</h3>Негізгі ойды түйіндеп, тұжырым жаса.</div><h3>Сынып бойынша сөз көлемі</h3><p>5-сынып: 60–80 сөз<br>6–7-сынып: 80–120 сөз<br>8–9-сынып: 120–180 сөз<br>10-сынып: 180–230 сөз<br>11-сынып: 250–300 сөз</p><p class="stat">Сіздің сыныбыңыздың нормасы: ${range()} сөз</p><h3>Бағалау критерийлері</h3><ul><li>Жеке көзқарас пен нақты пікір</li><li>Абзацтардың логикалық сабақтастығы</li><li>Орфография, пунктуация және тіл тазалығы</li><li>Дәйектер, мысалдар мен аргументтер</li></ul><h3>Эссеңді жаз</h3><input id="topic" placeholder="Эссе тақырыбы"><textarea id="studentText" oninput="countWords('essay')" placeholder="Кіріспеден баста..."></textarea><p id="counter" class="stat"></p><button class="action" onclick="saveText('essay')">💾 Сақтау</button><button class="action" onclick="evaluateEssay()">🔎 Құрылымын тексеру</button><div id="feedback"></div>`}
function poem(){return `<h2>🌿 Өлең шығаруды үйренеміз</h2><div class="note"><h3>1. Мазмұн мен идея</h3>Өлеңнің негізгі ойы айқын, сезімі шынайы болсын. Әр шумақ алдыңғы ойды толықтырып, тұтас шығарма құрасын.</div><div class="note"><h3>2. Ұйқас түрлері</h3>Егіз ұйқас: а-а-б-б<br>Кезектес ұйқас: а-б-а-б<br>Шалыс ұйқас: а-б-б-а<br>Қара өлең ұйқасы: а-а-б-а</div><div class="note"><h3>3. Буын, ырғақ, шумақ</h3>Жолдардағы буын санын үйлестір. Тармақ — бір өлең жолы, шумақ — бірнеше тармақтан құралған топ (көбіне 4 жол).</div><div class="note"><h3>4. Көркемдегіш құралдар</h3>Теңеу: «айдай сұлу».<br>Метафора: «алтын күн», «уақыт — емші».<br>Кейіптеу: «жел сыбырлады».<br>Синонимдерді орынды қолданып, бір сөзді қайта-қайта қолданба.</div><h3>Өз өлеңіңді жаз</h3><input id="topic" placeholder="Өлеңнің тақырыбы"><textarea id="studentText" oninput="countWords('poem')" placeholder="Бірінші шумақты жаз..."></textarea><p id="counter" class="stat"></p><button class="action" onclick="saveText('poem')">💾 Сақтау</button><button class="action" onclick="evaluatePoem()">🔎 Шумақ құрылымын тексеру</button><div id="feedback"></div>`}
function countWords(id){let t=document.getElementById('studentText');if(!t)return;let words=t.value.trim().split(/\s+/).filter(Boolean);document.getElementById('counter').textContent=`Сөз саны: ${words.length}`;localStorage.setItem('tilmura_'+id,t.value)}function saveText(id){saved[id]=(saved[id]||0)+1;localStorage.setItem('tilmura_progress',JSON.stringify(saved));alert('Жұмысыңыз осы құрылғыда сақталды!')}function scoreCard(title,checks,notes){let earned=checks.reduce((a,c)=>a+(c.ok?c.points:0),0),possible=checks.reduce((a,c)=>a+c.points,0);let html='<div class="note"><h3>'+title+'</h3><h2>'+earned+' / '+possible+' автоматты балл</h2><p>Деңгей: '+(earned/possible>=.85?'Өте жақсы':earned/possible>=.65?'Жақсы':earned/possible>=.4?'Дамып келеді':'Жаттығу қажет')+'</p>';checks.forEach(c=>html+='<p>'+(c.ok?'✅':'❌')+' '+c.name+' — '+(c.ok?c.points:0)+'/'+c.points+'</p>');html+='<p><b>Ұсыныстар:</b> '+notes.join(' ')+'</p><small>Бұл алдын ала автоматты құрылымдық баға. Мазмұн, көркемдік, сауаттылық және мәнерлеп оқу сапасын мұғалім бағалайды. Нәтиже ресми баға емес.</small></div>';document.getElementById('feedback').innerHTML=html;try{let history=JSON.parse(localStorage.getItem('tilmura_assessments')||'[]');history.push({date:new Date().toLocaleString('kk-KZ'),title,earned,possible,checks});localStorage.setItem('tilmura_assessments',JSON.stringify(history.slice(-100)))}catch(e){}}
function evaluateEssay(){let t=document.getElementById('studentText').value.trim();if(!t){document.getElementById('feedback').textContent='Алдымен эссе жазыңыз.';return}let words=t.split(/\s+/).filter(Boolean),n=words.length,paras=t.split(/\n\s*\n|\n/).filter(x=>x.trim()),g=Number(document.getElementById('grade')?.value)||5;let limits=g===5?[60,80]:g<=7?[80,120]:g<=9?[120,180]:g===10?[180,230]:[250,300];let parts=paras.length>=3,opin=/(менің ойымша|меніңше|менің пікірімше|деп ойлаймын|менің көзқарасым)/i.test(t),arg=/(себебі|өйткені|мысалы|мәселен|біріншіден|екіншіден)/i.test(t),end=/(қорытындылай|қорыта айтқанда|түйіндей|сондықтан|осылайша)/i.test(paras.at(-1)||'');let checks=[{name:'Сөз саны ('+n+', норма '+limits.join('–')+')',ok:n>=limits[0]&&n<=limits[1],points:4},{name:'Кіріспе, негізгі бөлім, қорытынды бөлек абзацта',ok:parts,points:4},{name:'Жеке көзқарас белгісі',ok:opin,points:2},{name:'Дәлел/мысал байланыстырушы сөздері',ok:arg,points:2},{name:'Қорытынды белгісі',ok:end,points:2},{name:'Соңғы тыныс белгісі',ok:/[.!?…]$/.test(t),points:2}];let notes=[];if(!checks[0].ok)notes.push('Сөз көлемін сынып нормасына келтіріңіз.');if(!parts)notes.push('Мәтінді кемінде үш бөлек абзацқа бөліңіз.');if(!opin)notes.push('Өз пікіріңізді нақты жазыңыз.');if(!arg)notes.push('Дәйек пен мысал келтіріңіз.');if(!end)notes.push('Қорытынды ой қосыңыз.');scoreCard('Эссе: тексерілген шарттар',checks,notes.length?notes:['Құрылымдық белгілер табылды. Мазмұн мен тіл тазалығын мұғаліммен тексеріңіз.'])}
function evaluatePoem(){let t=document.getElementById('studentText').value.trim();if(!t){document.getElementById('feedback').textContent='Алдымен өлең жазыңыз.';return}let lines=t.split('\n').map(x=>x.trim()).filter(Boolean),words=lines.map(x=>x.split(/\s+/).filter(Boolean));let checks=[{name:'Кемінде 4 тармақ',ok:lines.length>=4,points:4},{name:'Тармақ саны 4-ке бөлінеді',ok:lines.length%4===0,points:4},{name:'Әр тармақта кемінде 2 сөз',ok:words.every(x=>x.length>=2),points:4}];scoreCard('Өлең шығару: құрылымдық тексеріс',checks,['Ұйқас, буын, ырғақ, идея, шынайылық, теңеу және метафораны мұғаліммен тексеріңіз.'])}
function poetList(mode){return `<h2>${mode==='reading'?'🎙️ Мәнерлеп оқу':'📜 Өлең жаттау'}</h2><p>Ақынның жеке бетін ашыңыз. Микрофонға жазып, өз даусыңызды қайта тыңдай аласыз.</p><div class="poets">${poets.map((p,i)=>`<button class="poet" onclick="openPoet(${i},'${mode}')">📖<br>${p[0]}<small>Жеке әдеби бет →</small></button>`).join('')}</div>`}function openPoet(i,mode){let p=poets[i];content.innerHTML=`<button class="action" onclick="show('${mode}')">← Ақындар</button><div class="portrait">✦ ${p[0]} ✦<p style="font-size:16px">Қазақ әдебиетінің асыл мұрасы</p></div><h2>${p[2]}</h2><div class="note">${i===0?p[1].replace(/\n/g,'<br>'):'Бұл шығармаға арналған толық, құқықтары тексерілген мәтінді мұғалім енгізе алады.'}</div><h3>Мәнерлеп оқу жаттығуы</h3><p>Тыныс белгілерін сақтаңыз, сөздерді анық айтыңыз, дауыс ырғағы мен кідірісті бақылаңыз.</p><textarea id="readingText" placeholder="Оқитын мәтінді осында енгізіңіз">${i===0?p[1]:''}</textarea><button class="action" onclick="startRecord()">🎤 Жазуды бастау</button><button class="action" onclick="stopRecord()">⏹️ Тоқтату</button><p id="recordStatus">Микрофонға рұқсат қажет. Safari арқылы HTTPS сайтта ашыңыз.</p><div id="audioSlot"></div><button class="action" onclick="markDone('${mode}')">🏆 Жаттығуды аяқтадым</button>`}async function startRecord(){let status=document.getElementById('recordStatus');try{if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')throw Error('Бұл браузерде дыбыс жазу қолжетімсіз');stream=await navigator.mediaDevices.getUserMedia({audio:true});let types=['audio/mp4','audio/webm'];let mime=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recorded=[];recorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};recorder.onstop=()=>{let blob=new Blob(recorded,{type:recorder.mimeType||'audio/mp4'});let url=URL.createObjectURL(blob);document.getElementById('audioSlot').innerHTML=`<audio controls src="${url}"></audio><a class="action" style="display:inline-block" href="${url}" download="til-mura-oku.${blob.type.includes('mp4')?'m4a':'webm'}">⬇️ Жазбаны сақтау</a>`;stream.getTracks().forEach(t=>t.stop());status.textContent='Жазба дайын. Тыңдаңыз.'};recorder.start();status.textContent='🔴 Жазылып жатыр...'}catch(e){status.textContent='Микрофон ашылмады: '+e.message}}function stopRecord(){if(recorder?.state==='recording')recorder.stop()}function markDone(id){saved[id]=(saved[id]||0)+1;localStorage.setItem('tilmura_progress',JSON.stringify(saved));alert('Жаттығу орындалды деп белгіленді!')}
function dictionary(){return `<h2>📖 Қазақша–орысша сөздік</h2><input id="word" placeholder="Қазақша сөзді енгізіңіз" oninput="lookup()"><div id="definition" class="note">Мысалы: білім, өлең, достық, табиғат, еңбек, арман, кітап, мектеп.</div>`}let words={'білім':'знание','өлең':'стихотворение','достық':'дружба','табиғат':'природа','еңбек':'труд','арман':'мечта','кітап':'книга','мектеп':'школа','ақын':'поэт','ұйқас':'рифма','мәнерлеп оқу':'выразительное чтение','әдебиет':'литература'};function lookup(){let w=document.getElementById('word').value.toLocaleLowerCase('kk').trim();document.getElementById('definition').textContent=words[w]?`${w} — ${words[w]}`:'Сөздікке бұл сөз әлі енгізілмеген.'}function test(){return `<h2>🧠 Тест тапсырмасы</h2><div class="note"><h3>1. Эссенің негізгі бөліміне не жазылады?</h3><select id="q1"><option value="">Жауап таңдаңыз</option><option value="1">Дәлелдер мен мысалдар</option><option value="0">Тек тақырып атауы</option></select><h3>2. Қара өлең ұйқасы қандай?</h3><select id="q2"><option value="">Жауап таңдаңыз</option><option value="1">а-а-б-а</option><option value="0">а-б-б-а</option></select><h3>3. Теңеу қайсысы?</h3><select id="q3"><option value="">Жауап таңдаңыз</option><option value="0">Уақыт — емші</option><option value="1">Айдай сұлу</option></select></div><button class="action" onclick="gradeTest()">Жауаптарды тексеру</button><div id="feedback"></div>`}function gradeTest(){let v=[1,2,3].map(i=>document.getElementById('q'+i).value);if(v.some(x=>x==='')){document.getElementById('feedback').textContent='Барлық сұраққа жауап беріңіз.';return}let n=v.reduce((s,x)=>s+Number(x),0);saved.test=n;localStorage.setItem('tilmura_progress',JSON.stringify(saved));document.getElementById('feedback').innerHTML=`<div class="note">Нәтиже: ${n}/3 балл</div>`}function results(){return `<h2>🏆 Менің жетістігім</h2><div class="note">Эссе сақтау саны: ${saved.essay||0}<br>Өлең сақтау саны: ${saved.poem||0}<br>Өлең жаттау жаттығулары: ${saved.memorize||0}<br>Мәнерлеп оқу жаттығулары: ${saved.reading||0}<br>Соңғы тест нәтижесі: ${saved.test===undefined?'Әлі тапсырылмады':saved.test+'/3'}</div><p>Нәтижелер осы браузердің жергілікті жадында сақталады. Басқа құрылғыға автоматты көшірілмейді.</p>`}
</script><div id="authOverlay" role="dialog" aria-modal="true" aria-label="Жеке кабинет"><div class="authbox"><button onclick="closeLogin()">← Басты бет</button><div id="authArea"></div></div></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://lmatsfnefzxxiupstmry.supabase.co','sb_publishable_zxw6ciXZC6IA3EOAO2by4Q_BINUV5HD');
const overlay=document.getElementById('authOverlay'),area=document.getElementById('authArea');
let currentRole='student';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>{let e=document.getElementById('loginMessage');if(e)e.textContent=s};
window.closeLogin=()=>{overlay.style.display='none'};
window.openLogin=async role=>{currentRole=role;overlay.style.display='flex';await showLogin()};
async function showLogin(){const {data:{session}}=await supabase.auth.getSession();if(session){await showDashboard(session.user);return}area.innerHTML=`<h2>${currentRole==='teacher'?'Мұғалім кабинеті':'Оқушы кабинеті'}</h2><p class="subtle">${currentRole==='teacher'?'Supabase-та тіркелген мұғалім email-і мен құпиясөзі':'Мұғалім берген логин және құпиясөз'}</p><form id="authForm"><label>${currentRole==='teacher'?'Email':'Логин'}<input id="authLogin" required autocomplete="username"></label><label>Құпиясөз<input id="authPassword" type="password" required autocomplete="current-password"></label><button type="submit">Кіру</button></form><p id="loginMessage" role="status"></p>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();msg('Тексерілуде...');const username=document.getElementById('authLogin').value.trim(),password=document.getElementById('authPassword').value;let email=currentRole==='teacher'?username:username.toLowerCase()+'@students.tilmura.invalid';const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){msg('Кіру мүмкін болмады. Логин немесе құпиясөзді тексеріңіз.');return}await showDashboard(data.user)}}
async function showDashboard(user){let {data:teacher,error:teacherError}=await supabase.from('teachers').select('full_name').eq('user_id',user.id).maybeSingle();if(teacherError){msg(teacherError.message);return}if(teacher){currentRole='teacher';const {data:students,error}=await supabase.from('students').select('user_id,full_name,grade,login').eq('teacher_id',user.id).order('grade');if(error){area.innerHTML='<p>'+safe(error.message)+'</p>';return}area.innerHTML=`<h2>Мұғалім: ${safe(teacher.full_name)}</h2><p>Тіркелген оқушылар: ${students.length}</p><div class="note">${students.length?students.map(x=>`<p><button type="button" data-id="${safe(x.user_id)}" class="studentResultBtn">${safe(x.grade)}-сынып · ${safe(x.full_name)} (${safe(x.login)}) — нәтижелер</button></p>`).join(''):'Әзірге оқушы тіркелмеген.'}</div><p class="subtle">Оқушыларды қауіпсіз тіркеу функциясы келесі кезеңде қосылады.</p><div id="studentScores"></div><button id="logoutBtn">Шығу</button>`;area.querySelectorAll('.studentResultBtn').forEach(b=>b.onclick=async()=>{const {data,error}=await supabase.from('results').select('activity,poet,score,feedback,created_at').eq('student_id',b.dataset.id).order('created_at',{ascending:false});document.getElementById('studentScores').innerHTML=error?safe(error.message):`<h3>Нәтижелер</h3>${data.length?data.map(r=>`<p>${safe(r.activity)} · ${safe(r.poet)} · ${safe(r.score)} балл · ${safe(r.feedback)} · ${new Date(r.created_at).toLocaleDateString('kk-KZ')}</p>`).join(''):'Әзірге нәтиже жоқ.'}`});document.getElementById('logoutBtn').onclick=logout;return}
const {data:student,error}=await supabase.from('students').select('full_name,grade').eq('user_id',user.id).maybeSingle();if(error||!student){await supabase.auth.signOut();area.innerHTML='<p>Бұл аккаунтқа кабинет тағайындалмаған.</p><button id="retryLogin">Қайта кіру</button>';document.getElementById('retryLogin').onclick=showLogin;return}const {data:results,error:resultsError}=await supabase.from('results').select('activity,poet,score,feedback,created_at').eq('student_id',user.id).order('created_at',{ascending:false});area.innerHTML=`<h2>${safe(student.full_name)}</h2><p>${safe(student.grade)}-сынып</p><h3>Менің нәтижелерім</h3>${resultsError?`<p>${safe(resultsError.message)}</p>`:results?.length?results.map(r=>`<p>${safe(r.activity)} · ${safe(r.poet)} · ${safe(r.score)} балл · ${safe(r.feedback)}</p>`).join(''):'Әзірге нәтиже жоқ.'}<p class="subtle">Жаттығуларды басты беттен орындауға болады. Supabase-ке автоматты бағалау жазу әлі қосылмаған.</p><button id="logoutBtn">Шығу</button>`;document.getElementById('logoutBtn').onclick=logout}
async function logout(){await supabase.auth.signOut();await showLogin()}
</script></body></html>
